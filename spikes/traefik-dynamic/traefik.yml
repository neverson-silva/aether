# SPIKE-TRAEFIK: static config — habilita API, entrypoint web e o provider HTTP
# (dynamic config EM MEMÓRIA). O provider http é quem recebe o ProxyConfig.
# Nenhum arquivo dinâmico em disco.
api:
  insecure: true
  dashboard: true

entryPoints:
  web:
    address: ":18081"
  traefik:
    address: ":18082"

providers:
  http:
    endpoint: "http://127.0.0.1:18090/traefik"
    pollInterval: "1s"

log:
  level: INFO
