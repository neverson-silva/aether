services:
  alarik:
    image: ghcr.io/achtungsoftware/alarik@sha256:e0c470615104a6877411631619c9279354086daf7af5e398e433d2455bf7b408
    restart: unless-stopped
    volumes:
      - alarik-storage:/app/Storage
    environment:
      - API_BASE_URL=${API_BASE_URL}
      - CONSOLE_BASE_URL=${CONSOLE_BASE_URL}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT=${JWT}
      - ALLOW_ACCOUNT_CREATION=${ALLOW_ACCOUNT_CREATION}
    expose:
      - 8080

  console:
    image: ghcr.io/achtungsoftware/alarik-console@sha256:56c8804c8d1c4281809170f6ee6d4e436b11ef79e778aaaf0f32667e5e74ff3e
    restart: unless-stopped
    environment:
      - NUXT_PUBLIC_API_BASE_URL=${API_BASE_URL}
      - NUXT_PUBLIC_CONSOLE_BASE_URL=${CONSOLE_BASE_URL}
      - NUXT_PUBLIC_ALLOW_ACCOUNT_CREATION=${ALLOW_ACCOUNT_CREATION}
    expose:
      - 3000
    depends_on:
      - alarik

volumes:
  alarik-storage:
