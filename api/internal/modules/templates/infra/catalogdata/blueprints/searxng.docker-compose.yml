services:
  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - valkey-data:/data

  searxng:
    image: searxng/searxng@sha256:8486daaebc65adacfe434be38b991cf90da92d3fd80ae9f0ab1409ba65664e28
    restart: unless-stopped
    volumes:
      - ../files/searxng:/etc/searxng
      - searxng-data:/var/cache/searxng

volumes:
  valkey-data: {}
  searxng-data: {}
