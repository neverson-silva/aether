version: "3.8"
services:
  ipfs:
    image: ipfs/kubo@sha256:63f5502f7a01b82a675e45bae81b2f5dfa90248ec4a86cd0a58c218347e1f2d2
    restart: unless-stopped
    environment:
      - IPFS_PROFILE=server
    volumes:
      - ipfs_data:/data/ipfs
      - ipfs_staging:/export
    expose:
      - 4001
      - 8080
      - 5001
volumes:
  ipfs_data: {}
  ipfs_staging: {}
