services:
  plausible_db:
    image: postgres:16-alpine
    restart: always

    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  plausible_events_db:
    image: clickhouse/clickhouse-server:25.5.6
    restart: always
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: plausible
      CLICKHOUSE_DATABASE_URL: http://default:plausible@plausible_events_db:8123/plausible_events_db
    command:
      - sh
      - -c
      - printf '%s' '<clickhouse><background_schedule_pool_size>8</background_schedule_pool_size></clickhouse>' > /etc/clickhouse-server/config.d/aether-tuning.xml && exec /entrypoint.sh
    volumes:
      - event-data:/var/lib/clickhouse
      - event-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  plausible:
    image: ghcr.io/plausible/community-edition:v2.1.5
    restart: always
    command: sh -c "sleep 10 && /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_events_db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: plausible

volumes:
  db-data:
    driver: local
  event-data:
    driver: local
  event-logs:
    driver: local
