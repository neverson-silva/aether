services:
  agentdvr:
    image: mekayelanik/ispyagentdvr@sha256:760072f357330c4ac17c836abf09f5e5a431795e1f30dfa89cc30b538a4c2416
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-America/New_York}
      - AGENTDVR_WEBUI_PORT=8090
    volumes:
      - agentdvr-config:/AgentDVR/Media/XML/
      - agentdvr-media:/AgentDVR/Media/WebServerRoot/Media/
      - agentdvr-commands:/AgentDVR/Commands/
    expose:
      - 8090
      - 3478/udp
      - 50000-50100/udp
volumes:
  agentdvr-config: {}
  agentdvr-media: {}
  agentdvr-commands: {}
