version: "3.8"

services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox@sha256:b1ad7e3c63f732a5f6daa466e8116be4f545b3b120383a64dcb62beb00a660cc
    restart: unless-stopped
    expose:
      - "7745"
    environment:
      - TZ=${TZ}
      - HBOX_AUTH_API_KEY_PEPPER=${HBOX_AUTH_API_KEY_PEPPER}
    volumes:
      - homebox-data:/data

volumes:
  homebox-data:
