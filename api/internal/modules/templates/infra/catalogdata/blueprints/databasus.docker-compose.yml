services:
  databasus:
    image: databasus/databasus@sha256:03b1e913fe4c15c933d0a35e85252aee465cb76c0b3d200535d4d8d570b5fa45
    expose:
      - "4005"
    volumes:
      # Persistent data storage
      - databasus-data:/databasus-data
    restart: unless-stopped
    environment:
      # Optional: Set timezone
      - TZ=UTC
    healthcheck:
      test: [ "CMD", "databasus", "healthcheck" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  databasus-data:
    driver: local
