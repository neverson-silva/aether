services:
  glpi-mysql:
    image: mysql:9.1.0
    restart: always
    volumes:
      - glpi-mysql-data:/var/lib/mysql


  glpi-web:
    image: elestio/glpi:10.0.16
    restart: always
    volumes:
      - glpi-www-data:/var/www/html/glpi
    environment:
      - TIMEZONE=Europe/Brussels


volumes:
  glpi-mysql-data:
  glpi-www-data:
