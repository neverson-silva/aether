version: "3.8"

services:
  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis_data:/data

  flowise:
    image: flowiseai/flowise@sha256:cf880b17b1290fbaebebc76c33954bde67b3775aff95feec72a1d060cc81e43d
    restart: always
    expose:
      - 3000
    volumes:
      - flowise_data:/root/.flowise
    environment:
      PORT: 3000
      DATABASE_PATH: /root/.flowise
      REDIS_URL: redis://redis:6379
      JWT_AUTH_TOKEN_SECRET: ${JWT_AUTH_TOKEN_SECRET}
      JWT_REFRESH_TOKEN_SECRET: ${JWT_REFRESH_TOKEN_SECRET}
      EXPRESS_SESSION_SECRET: ${EXPRESS_SESSION_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    entrypoint: /bin/sh -c "sleep 3; flowise start"
    depends_on:
      - redis

  flowise-worker:
    image: flowiseai/flowise-worker@sha256:9541f6dcb44f7f2285c1e7c5e05b7f50dac99d5f830011a62597aa8a145d827a
    restart: always
    volumes:
      - flowise_data:/root/.flowise
    environment:
      WORKER_PORT: 5566
      DATABASE_PATH: /root/.flowise
      REDIS_URL: redis://redis:6379
      JWT_AUTH_TOKEN_SECRET: ${JWT_AUTH_TOKEN_SECRET}
      JWT_REFRESH_TOKEN_SECRET: ${JWT_REFRESH_TOKEN_SECRET}
      EXPRESS_SESSION_SECRET: ${EXPRESS_SESSION_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5566/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    entrypoint: /bin/sh -c "node /app/healthcheck/healthcheck.js & sleep 5 && pnpm run start-worker"
    depends_on:
      - redis
      - flowise

volumes:
  redis_data:
  flowise_data:
