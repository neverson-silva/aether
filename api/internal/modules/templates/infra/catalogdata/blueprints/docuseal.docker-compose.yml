services:
  app:
    image: docuseal/docuseal@sha256:209b1ef44d4bc0246188c3e81fbba706c4788dfd11012a5a2c9a9b06e00a586b
    volumes:
      - docuseal:/data/docuseal
    depends_on:
      docu-postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-docuseal}:${POSTGRES_PASSWORD}@docu-postgres:5432/${POSTGRES_DB:-docuseal}
      
  docu-postgres:
    image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    volumes:
      - docuseal-db:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docuseal} -d ${POSTGRES_DB:-docuseal}"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  docu-redis:
    image: redis:alpine
    restart: always
    volumes:
      - docuseal-redis-data:/data
      
    
volumes:
  docuseal:
  docuseal-db:
  docuseal-redis-data:
