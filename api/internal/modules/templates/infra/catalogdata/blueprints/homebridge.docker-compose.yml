services:
  homebridge:
    image: homebridge/homebridge@sha256:77c685a40911b3b95448f3550be0c8b94cd7b4e66daecc1cc39a8285be75b245
    restart: always
    expose:
      - 8581
    volumes:
      - ./volumes/homebridge:/homebridge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://homebridge:8581/"]
      interval: 60s
      retries: 5
      start_period: 300s
      timeout: 2s
