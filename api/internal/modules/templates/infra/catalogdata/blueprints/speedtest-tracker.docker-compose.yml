services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker@sha256:1193562c4ab4fe29cffd5e6ad4c042a2ed02e218999bedc7c801c96e032d9f9b
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: sqlite
    volumes:
      - speedtest_config:/config
    expose:
      - "80"
volumes:
  speedtest_config:
