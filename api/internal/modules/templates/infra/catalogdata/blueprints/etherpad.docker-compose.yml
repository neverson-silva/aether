version: "3.8"
services:
  app:
    user: "0:0"
    image: etherpad/etherpad@sha256:6020e7b57f4b17389ef000a5a2b04e6ab3ea6659c7c7ab83b81587010fa58be4
    tty: true
    stdin_open: true
    volumes:
      - ../files/plugins:/opt/etherpad-lite/src/plugin_packages
      - ../files/etherpad_var:/opt/etherpad-lite/var
    depends_on:
      - postgres
    environment:
      NODE_ENV: ${NODE_ENV}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_CHARSET: ${DB_CHARSET}
      DB_HOST: postgres
      DB_NAME: etherpad
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_PORT: "5432"
      DB_TYPE: postgres
      DB_USER: admin
      DEFAULT_PAD_TEXT: ${DEFAULT_PAD_TEXT}
      DISABLE_IP_LOGGING: ${DISABLE_IP_LOGGING}
      SOFFICE: ${SOFFICE}
      TRUST_PROXY: ${TRUST_PROXY}
    restart: always
    expose:
      - 9001
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      PGDATA: /var/lib/postgresql/data/pgdata
    restart: always
    volumes:
      - ../files/postgres_data:/var/lib/postgresql/data/pgdata
