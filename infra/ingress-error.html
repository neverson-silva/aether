<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service taking a tiny nap</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #0d1117; color: #f5f7ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 0%, #23365d 0, #0d1117 58%); }
    main { width: min(680px, 100%); text-align: center; }
    .orbit { position: relative; width: 150px; height: 150px; margin: 0 auto 28px; border: 2px solid #5e7ecb; border-radius: 50%; animation: drift 5s ease-in-out infinite; }
    .orbit::before, .orbit::after { content: ""; position: absolute; inset: 18px -18px; border: 2px solid #b0c6ff; border-radius: 50%; transform: rotate(58deg); opacity: .65; }
    .orbit::after { inset: -18px 18px; transform: rotate(-58deg); opacity: .35; }
    .planet { position: absolute; inset: 43px; display: grid; place-items: center; border-radius: 50%; background: #376bcf; box-shadow: 0 0 34px #376bcf88; font-size: 32px; }
    h1 { margin: 0; font-size: clamp(30px, 6vw, 56px); line-height: 1.05; letter-spacing: -.04em; }
    p { margin: 18px auto 0; max-width: 520px; color: #c4cbe0; font-size: 18px; line-height: 1.6; }
    .status { display: inline-flex; gap: 8px; align-items: center; margin-top: 28px; padding: 10px 14px; border: 1px solid #465273; border-radius: 999px; color: #b0c6ff; background: #172039; font-size: 14px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ffb4ab; box-shadow: 0 0 12px #ffb4ab; }
    small { display: block; margin-top: 24px; color: #8992ac; }
    @keyframes drift { 50% { transform: translateY(-8px) rotate(3deg); } }
    @media (prefers-reduced-motion: reduce) { .orbit { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="orbit" aria-hidden="true"><div class="planet">zzz</div></div>
    <h1>This service is taking a tiny nap.</h1>
    <p>The proxy is awake, but the application wandered off for coffee. It may be restarting, deploying, or having a thoughtful moment.</p>
    <div class="status"><span class="dot"></span>Service temporarily unavailable</div>
    <small>Try again in a moment. If this keeps happening, check the deployment logs.</small>
  </main>
</body>
</html>
