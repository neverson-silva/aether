services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether
      POSTGRES_DB: aether
    volumes:
      - aether-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  aether:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: aether
      DATABASE_USER: aether
      DATABASE_PASSWORD: aether
      DATABASE_SSL_MODE: disable
      AETHER_API_ADDR: 0.0.0.0:8080
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  aether-pg:
